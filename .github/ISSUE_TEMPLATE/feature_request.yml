name: Idea or feature request
description: Something Notato could do, or do better.
labels: ["enhancement"]
body:
    - type: textarea
      id: problem
      attributes:
          label: What you are trying to do
          description: The situation, and what gets in the way today.
      validations:
          required: true
    - type: textarea
      id: idea
      attributes:
          label: What would help
          description: How you picture it working. Rough is fine.
    - type: textarea
      id: else
      attributes:
          label: Anything else
          description: Workarounds you use now, or other tools that do it well.
