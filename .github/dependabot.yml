# Version updates, once a month, one pull request per ecosystem. Security updates are separate: they are turned on
# in the repository's settings (Code security) and arrive as soon as an advisory is published.
#
# Native SDKs and the independently locked Expo example are included. Review compatibility and update the
# stable toolchain pins together; consumer peer ranges and deployment targets are separate compatibility contracts.
version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      target-branch: develop
      schedule:
          interval: monthly
      groups:
          actions:
              patterns: ["*"]

    - package-ecosystem: bun
      directory: /
      target-branch: develop
      schedule:
          interval: monthly
      groups:
          bun:
              patterns: ["*"]

    # The Dockerfile pins each image by tag and digest, and this moves both. List the folder of any other Dockerfile
    # here too, or its pins will never move. Bun's version in the workflows is not something Dependabot can see: move
    # it with the Dockerfile's oven/bun image.
    - package-ecosystem: docker
      directories: ["/", "/services", "/deploy/self-hosted", "/deploy/self-hosted/examples"]
      target-branch: develop
      schedule:
          interval: monthly
      groups:
          docker:
              patterns: ["*"]

    - package-ecosystem: npm
      directory: /sdks/react-native/example
      target-branch: develop
      schedule:
          interval: monthly
      groups:
          expo:
              patterns: ["*"]

    - package-ecosystem: nuget
      directory: /sdks/dotnet
      target-branch: develop
      schedule:
          interval: monthly
      groups:
          dotnet:
              patterns: ["*"]

    - package-ecosystem: gradle
      directories: ["/sdks/android", "/sdks/flutter/example/android"]
      target-branch: develop
      schedule:
          interval: monthly
      groups:
          android:
              patterns: ["*"]

    - package-ecosystem: pub
      directories: ["/sdks/flutter", "/sdks/flutter/example"]
      target-branch: develop
      schedule:
          interval: monthly
      groups:
          flutter:
              patterns: ["*"]

    - package-ecosystem: swift
      directory: /
      target-branch: develop
      schedule:
          interval: monthly
      groups:
          swift:
              patterns: ["*"]
