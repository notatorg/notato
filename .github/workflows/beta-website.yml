name: Beta website promotion

# Website-only deployment from the released 0.2 baseline. No package release or 0.3 merge.
# v-site-beta-* has no version dots, so it cannot trigger Release's v*.*.* tag filter.
# The existing Pages environment already permits v* tags.
on:
    push:
        tags: [v-site-beta-*]

permissions:
    contents: read

concurrency:
    group: beta-website
    cancel-in-progress: false

jobs:
    site:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
            - run: bun install --frozen-lockfile
            - run: bun run build:site
            - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
              with:
                  path: site/dist
    deploy:
        needs: site
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}
        steps:
            - id: deploy
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
