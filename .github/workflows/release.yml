name: Release

# Push a tag like v0.3.0, made from a commit where `bun scripts/version.ts 0.3.0` set every package's version. Every
# tag builds and checks everything; a registry is published to only when its switch is on: a repository variable set
# to "true" (Settings › Secrets and variables › Actions › Variables). Until then a tag is a full dry run.
#
#   PUBLISH_NPM     npm: notato, @notato/cli-*, and every public package      secret NPM_TOKEN
#   PUBLISH_DOCKER  ghcr.io/notatorg/notato                                    (the workflow's own token)
#   PUBLISH_MAVEN   Maven Central: dev.notato:notato-android, notato-compose   secrets MAVEN_CENTRAL_USERNAME,
#                                                                              MAVEN_CENTRAL_PASSWORD (a Central Portal
#                                                                              user token), SIGNING_KEY (ASCII-armoured
#                                                                              private key), SIGNING_KEY_PASSWORD
#   PUBLISH_NUGET   nuget.org: Notato.Maui                                     variable NUGET_USER: no key, nuget.org trusts
#                                                                              this workflow (a Trusted Publishing policy)
#   PUBLISH_PUB     pub.dev: notato (Flutter)                                  none: pub.dev trusts this repository's tags
#                                                                              (its admin page, "Automated publishing")
#   PUBLISH_SITE    the website and docs on GitHub Pages                       (Pages set to "GitHub Actions")
#   PUBLISH_GITHUB  a GitHub release with the binaries and the extension zip
#
# SwiftPM needs nothing: it reads Package.swift at the tag, so the tag is the Swift release. RELEASING.md has the rest.

on:
    push:
        tags: ["v*.*.*"]

permissions:
    contents: read

jobs:
    version:
        name: The tag is every package's version
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
            - run: bun scripts/version.ts --tag "$GITHUB_REF_NAME"

    binaries:
        name: Binary (${{ matrix.target }})
        needs: version
        strategy:
            fail-fast: true
            matrix:
                include:
                    - { os: ubuntu-latest, target: bun-linux-x64, exe: notato }
                    - { os: ubuntu-24.04-arm, target: bun-linux-arm64, exe: notato }
                    - { os: macos-15, target: bun-darwin-arm64, exe: notato }
                    - { os: macos-15-intel, target: bun-darwin-x64, exe: notato }
                    - { os: windows-latest, target: bun-windows-x64, exe: notato.exe }
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: latest
            - run: bun install --frozen-lockfile
            - name: Build
              shell: bash
              run: bun run scripts/build-release.ts --targets ${{ matrix.target }} --skip-libs --skip-extension --no-pack
            - name: Smoke test the binary
              shell: bash
              run: bun run scripts/smoke-binary.ts dist/release/bin/${{ matrix.target }}/${{ matrix.exe }} --version "${GITHUB_REF_NAME#v}"
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: bin-${{ matrix.target }}
                  # A re-run replaces what an earlier attempt uploaded, so later jobs never find two of a name.
                  overwrite: true
                  path: dist/release/bin/${{ matrix.target }}
                  if-no-files-found: error

    npm:
        name: npm${{ vars.PUBLISH_NPM != 'true' && ' (dry run)' || '' }}
        needs: binaries
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # npm provenance
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: latest
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - run: bun install --frozen-lockfile
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: bin-*
                  path: artifacts
            # Each artifact lands in a folder named after it (bin-bun-linux-x64), and the build looks for the
            # target's own name (dist/release/bin/bun-linux-x64).
            - name: Put each binary where the build looks for it
              run: |
                  mkdir -p dist/release/bin
                  for dir in artifacts/bin-*; do mv "$dir" "dist/release/bin/${dir#artifacts/bin-}"; done
                  ls -R dist/release/bin
            - name: Assemble the packages from the tested binaries
              run: bun run scripts/build-release.ts --skip-compile --skip-web --no-pack
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: extension
                  overwrite: true
                  path: dist/release/notato-extension-*.zip
            # Libraries and platform packages first, the launcher last, so it never points at a version not there yet.
            - name: Publish${{ vars.PUBLISH_NPM != 'true' && ' --dry-run' || '' }}
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  DRY_RUN: ${{ vars.PUBLISH_NPM != 'true' && '--dry-run' || '' }}
              run: |
                  # A pre-release (v0.3.0-rc.1) goes out under `next`, so `npm i notato` stays on the last release.
                  case "$GITHUB_REF_NAME" in *-*) DIST_TAG="--tag next" ;; *) DIST_TAG="" ;; esac
                  cd dist/release/packages
                  for dir in */; do
                    [ "$dir" = "notato/" ] || npm publish "./$dir" --access public $DIST_TAG $DRY_RUN
                  done
                  npm publish ./notato --access public $DIST_TAG $DRY_RUN

    docker:
        name: Docker image${{ vars.PUBLISH_DOCKER != 'true' && ' (build only)' || '' }}
        needs: version
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              if: vars.PUBLISH_DOCKER == 'true'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: ${{ vars.PUBLISH_DOCKER == 'true' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  build-args: VERSION=${{ steps.meta.outputs.version }}

    maven:
        name: Maven Central${{ vars.PUBLISH_MAVEN != 'true' && ' (bundle only)' || '' }}
        needs: version
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: sdks/android
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
              with:
                  distribution: temurin
                  java-version: 21
            - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
            - name: Central only takes signed artifacts
              if: vars.PUBLISH_MAVEN == 'true'
              env:
                  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
              run: |
                  if [ -z "$SIGNING_KEY" ]; then
                    echo "PUBLISH_MAVEN is on but the SIGNING_KEY secret is not set" >&2
                    exit 1
                  fi
            - name: Build, sign and stage both libraries
              env:
                  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
                  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
              run: ./gradlew :notato:publishAllPublicationsToStagingRepository :notato-compose:publishAllPublicationsToStagingRepository --console=plain
            # The Central Portal takes one zip of the repository layout; it makes its own maven-metadata.xml.
            - name: Bundle
              run: cd build/staging-deploy && zip -qr ../central-bundle.zip . -x '*maven-metadata*'
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: maven-central-bundle
                  overwrite: true
                  path: sdks/android/build/central-bundle.zip
            - name: Upload to the Central Portal
              if: vars.PUBLISH_MAVEN == 'true'
              env:
                  USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
                  PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
              run: |
                  curl --fail-with-body -X POST \
                    "https://central.sonatype.com/api/v1/publisher/upload?name=notato-${GITHUB_REF_NAME#v}&publishingType=AUTOMATIC" \
                    -H "Authorization: Bearer $(printf '%s:%s' "$USERNAME" "$PASSWORD" | base64 -w0)" \
                    -F "bundle=@build/central-bundle.zip"

    nuget:
        name: NuGet${{ vars.PUBLISH_NUGET != 'true' && ' (pack only)' || '' }}
        needs: version
        permissions:
            contents: read
            id-token: write # nuget.org Trusted Publishing: a key that lasts an hour, for this workflow only
        # iOS and Mac Catalyst targets build only on macOS; Xcode 26.6 by default, which the pinned workload builds with.
        runs-on: macos-26
        defaults:
            run:
                working-directory: sdks/dotnet
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
              with:
                  global-json-file: sdks/dotnet/global.json
            # The same workload set as the SDK's CI (.github/workflows/sdk-dotnet.yml).
            - run: dotnet workload install maui --version 10.0.401
            - run: dotnet pack src/Notato.Maui -c Release -o artifacts
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: nuget
                  overwrite: true
                  path: sdks/dotnet/artifacts/*
            - name: Sign in to nuget.org
              id: nuget
              if: vars.PUBLISH_NUGET == 'true'
              uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
              with:
                  user: ${{ vars.NUGET_USER }}
            - name: Push to nuget.org
              if: vars.PUBLISH_NUGET == 'true'
              env:
                  NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
              # The .snupkg beside each package goes up with it.
              run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

    pub:
        name: pub.dev${{ vars.PUBLISH_PUB != 'true' && ' (dry run)' || '' }}
        needs: version
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # pub.dev takes the workflow's own identity, no token
        defaults:
            run:
                working-directory: sdks/flutter
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # Sets up pub.dev's credentials from the workflow's identity, then Flutter does the publishing.
            - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
            - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
              with:
                  channel: stable
            - run: flutter pub get
            - run: flutter pub publish --dry-run
            - name: Publish
              if: vars.PUBLISH_PUB == 'true'
              run: flutter pub publish --force

    site:
        name: Website
        needs: version
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
            - run: bun install --frozen-lockfile
            # From the tag, so the docs describe what this release installs, not what main has since.
            - run: bun run build:site
            - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: site/dist

    site-deploy:
        name: Website on GitHub Pages
        if: vars.PUBLISH_SITE == 'true'
        needs: site
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}
        steps:
            - id: deploy
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

    github-release:
        name: GitHub release
        if: vars.PUBLISH_GITHUB == 'true'
        needs: [binaries, npm]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            # The release's notes start with its CHANGELOG.md entry; GitHub's list of what was merged follows.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
            - run: bun scripts/version.ts --notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
            # Only what the release carries: downloading everything also takes the Docker job's build record, which
            # download-artifact cannot extract.
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: bin-*
                  path: artifacts
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: extension
                  path: artifacts/extension
            - name: Name each binary after its platform
              run: |
                  mkdir upload
                  for dir in artifacts/bin-*; do
                    target="${dir#artifacts/bin-bun-}"
                    for file in "$dir"/*; do
                      case "$file" in *.exe) cp "$file" "upload/notato-$target.exe" ;; *) cp "$file" "upload/notato-$target" ;; esac
                    done
                  done
                  cp artifacts/extension/*.zip upload/
            - env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "$GITHUB_REF_NAME" upload/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
