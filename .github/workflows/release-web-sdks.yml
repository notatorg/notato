name: Release web SDKs

# A separate prefix keeps the standalone CLI/server and native registries out of this release.
on:
    push:
        tags: ["web-sdk-v*.*.*"]

permissions:
    contents: read
    id-token: write

concurrency:
    group: web-sdk-release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        name: Verify and publish web SDKs
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: latest
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - run: bun install --frozen-lockfile
            - name: Verify version and public scope
              run: |
                  bun scripts/version.ts --tag "$GITHUB_REF_NAME"
                  test ! -e packages/server/src/managed-auth.ts
                  test ! -e packages/server/src/billing.ts
                  test ! -e packages/server/src/hosted-guard.ts
            - run: bun run check
            - run: bun scripts/build-release.ts --web-sdks-only
            - run: bun scripts/verify-web-sdk-release.ts
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: web-sdk-packages
                  path: dist/release/tarballs/*.tgz
            - name: Check npm publication
              run: bun scripts/publish-web-sdks.ts --dry-run
            - name: Publish
              if: vars.PUBLISH_NPM == 'true'
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: bun scripts/publish-web-sdks.ts
