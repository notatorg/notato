name: Flutter SDK

on:
    push:
        branches: [main]
        paths: ["sdks/flutter/**", "packages/schema/**", ".github/workflows/sdk-flutter.yml"]
    pull_request:
        paths: ["sdks/flutter/**", "packages/schema/**", ".github/workflows/sdk-flutter.yml"]

permissions:
    contents: read

concurrency:
    group: flutter-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Analyze, tests and the example
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
              with:
                  channel: stable
                  cache: true
            # The contract tests run the server's Zod schema over the package's JSON.
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
            - run: bun install --frozen-lockfile
            - name: Analyze
              working-directory: sdks/flutter
              run: |
                  flutter pub get
                  flutter analyze
                  dart format --output=none --set-exit-if-changed lib test example/lib
            - name: Tests
              working-directory: sdks/flutter
              run: flutter test
            - name: The example builds
              working-directory: sdks/flutter/example
              run: flutter build web --debug
            - name: The package is ready for pub.dev
              working-directory: sdks/flutter
              run: dart pub publish --dry-run
