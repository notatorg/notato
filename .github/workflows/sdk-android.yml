name: Android SDK

on:
    push:
        branches: [main]
        paths: ["sdks/android/**", "packages/schema/**", ".github/workflows/sdk-android.yml"]
    pull_request:
        paths: ["sdks/android/**", "packages/schema/**", ".github/workflows/sdk-android.yml"]

permissions:
    contents: read

concurrency:
    group: android-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Tests, lint and sample build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21
            - uses: gradle/actions/setup-gradle@v4
            # The contract tests run the server's Zod schema over the library's JSON.
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - name: Unit tests
              working-directory: sdks/android
              run: ./gradlew test --console=plain
            - name: Lint the libraries and build the sample
              working-directory: sdks/android
              run: ./gradlew :notato:lintDebug :notato-compose:lintDebug :sample:assembleDebug --console=plain
