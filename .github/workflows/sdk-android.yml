name: Android SDK

on:
    push:
        branches: [main]
        paths: ["sdks/android/**", "packages/schema/**", ".github/workflows/sdk-android.yml"]
    pull_request:
        paths: ["sdks/android/**", "packages/schema/**", ".github/workflows/sdk-android.yml"]

permissions:
    contents: read

concurrency:
    group: android-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Tests, lint and sample build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
              with:
                  distribution: temurin
                  java-version: 21
            - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
            # The contract tests run the server's Zod schema over the library's JSON.
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
            - run: bun install --frozen-lockfile
            - name: Unit tests
              working-directory: sdks/android
              run: ./gradlew test --console=plain
            - name: Lint the libraries and build the sample
              working-directory: sdks/android
              run: ./gradlew :notato:lintDebug :notato-compose:lintDebug :sample:assembleDebug --console=plain
