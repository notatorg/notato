name: Android SDK

on:
    push:
        branches: [main, develop]
        paths: ["sdks/android/**", "packages/schema/**", ".github/workflows/sdk-android.yml"]
    pull_request:
        paths: ["sdks/android/**", "packages/schema/**", ".github/workflows/sdk-android.yml"]

permissions:
    contents: read

concurrency:
    group: android-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Tests, lint and sample build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
              with:
                  distribution: temurin
                  java-version: 21
            - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
            # The contract tests run the server's Zod schema over the library's JSON.
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.3
            - run: bun install --frozen-lockfile
            - name: Unit tests
              working-directory: sdks/android
              run: ./gradlew test --console=plain
            - name: Lint the libraries and build the sample
              working-directory: sdks/android
              run: ./gradlew :notato:lintDebug :notato-compose:lintDebug :sample:assembleDebug --console=plain
