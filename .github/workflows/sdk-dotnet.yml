name: .NET MAUI SDK

on:
    push:
        branches: [main, develop]
        paths: ["sdks/dotnet/**", "packages/schema/schema.json", ".github/workflows/sdk-dotnet.yml"]
    pull_request:
        paths: ["sdks/dotnet/**", "packages/schema/schema.json", ".github/workflows/sdk-dotnet.yml"]

permissions:
    contents: read

concurrency:
    group: dotnet-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # The schema contract and everything that is not drawing: fast, on Linux.
    tests:
        name: Tests (net10.0)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: sdks/dotnet
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
              with:
                  global-json-file: sdks/dotnet/global.json
            # A reviewed stable workload set, matching the local native build.
            - run: dotnet workload install maui-android --version 10.0.402.1
            - run: dotnet test tests/Notato.Maui.Tests
            - run: dotnet test tests/Notato.Aspire.Tests

    # Every platform the SDK targets, and the sample app, compile.
    build:
        name: Build (iOS, Mac Catalyst, Android)
        # The stable iOS 27 workload requires Xcode 27.
        runs-on: xcode-27
        env:
            DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
        defaults:
            run:
                working-directory: sdks/dotnet
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
              with:
                  global-json-file: sdks/dotnet/global.json
            - run: dotnet workload install maui --version 10.0.402.1
            # The house style (sdks/dotnet/.editorconfig) as build errors, on every target.
            - run: dotnet build src/Notato.Maui -c Release -p:EnforceCodeStyleInBuild=true -p:TreatWarningsAsErrors=true
            - run: dotnet build src/Notato.Aspire -c Release -p:EnforceCodeStyleInBuild=true -p:TreatWarningsAsErrors=true
            - run: dotnet build samples/Notato.Maui.Sample -f net10.0-android
            - run: dotnet build samples/Notato.Maui.Sample -f net10.0-ios -p:RuntimeIdentifier=iossimulator-arm64
            - run: dotnet build samples/Notato.Maui.Sample -f net10.0-maccatalyst
            - run: dotnet pack src/Notato.Maui -c Release -o artifacts
            - run: dotnet pack src/Notato.Aspire -c Release -o artifacts
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: Notato.Maui-nupkg
                  path: sdks/dotnet/artifacts/*.nupkg

    windows:
        name: Build (Windows)
        runs-on: windows-latest
        defaults:
            run:
                working-directory: sdks/dotnet
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
              with:
                  global-json-file: sdks/dotnet/global.json
            - run: dotnet workload install maui-windows --version 10.0.402.1
            - run: dotnet build src/Notato.Maui -c Release -p:TargetFrameworks=net10.0-windows10.0.19041.0 -p:EnforceCodeStyleInBuild=true -p:TreatWarningsAsErrors=true
            - run: dotnet build samples/Notato.Maui.Sample -p:TargetFrameworks=net10.0-windows10.0.19041.0
