name: .NET MAUI SDK

on:
    push:
        branches: [main]
        paths: ["sdks/dotnet/**", "packages/schema/schema.json", ".github/workflows/sdk-dotnet.yml"]
    pull_request:
        paths: ["sdks/dotnet/**", "packages/schema/schema.json", ".github/workflows/sdk-dotnet.yml"]

permissions:
    contents: read

concurrency:
    group: dotnet-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # The schema contract and everything that is not drawing: fast, on Linux.
    tests:
        name: Tests (net10.0)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: sdks/dotnet
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
              with:
                  global-json-file: sdks/dotnet/global.json
            - run: dotnet workload install maui-android
            - run: dotnet test tests/Notato.Maui.Tests

    # Every platform the SDK targets, and the sample app, compile.
    build:
        name: Build (iOS, Mac Catalyst, Android)
        runs-on: macos-15
        defaults:
            run:
                working-directory: sdks/dotnet
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
              with:
                  global-json-file: sdks/dotnet/global.json
            - run: dotnet workload install maui
            - run: dotnet build src/Notato.Maui -c Release
            - run: dotnet build samples/Notato.Maui.Sample -f net10.0-android
            - run: dotnet build samples/Notato.Maui.Sample -f net10.0-ios -p:RuntimeIdentifier=iossimulator-arm64
            - run: dotnet pack src/Notato.Maui -c Release -o artifacts
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: Notato.Maui-nupkg
                  path: sdks/dotnet/artifacts/*.nupkg
