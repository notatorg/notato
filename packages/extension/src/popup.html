<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notato</title>
<style>
  :root { color-scheme: light dark; }
  body { width: 340px; margin: 0; padding: 14px 16px 16px; font: 13px/1.4 system-ui, sans-serif; }
  h1 { margin: 0 0 2px; font-size: 15px; }
  .site { margin: 0 0 12px; color: #6b7280; overflow-wrap: anywhere; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid rgba(128,128,128,.25); }
  .row strong { display: block; }
  .row small { color: #6b7280; }
  .sw { position: relative; flex: none; width: 38px; height: 22px; border: 0; border-radius: 999px; background: #9ca3af; cursor: pointer; padding: 0; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .12s; }
  .sw[aria-checked="true"] { background: #2563eb; }
  .sw[aria-checked="true"]::after { transform: translateX(16px); }
  .sw:disabled { opacity: .45; cursor: default; }
  label { display: grid; gap: 3px; margin: 8px 0; font-size: 12px; color: #6b7280; }
  input { padding: 6px 8px; border: 1px solid rgba(128,128,128,.5); border-radius: 7px; font: inherit; color: inherit; background: transparent; }
  input:focus { outline: 2px solid #3b82f6; outline-offset: 0; }
  .buttons { display: flex; gap: 8px; margin-top: 10px; }
  button.b { padding: 6px 12px; border-radius: 7px; border: 1px solid rgba(128,128,128,.5); background: transparent; color: inherit; font: inherit; cursor: pointer; }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 600; }
  .msg { margin: 8px 0 0; min-height: 18px; font-size: 12px; }
  .ok { color: #16a34a; } .bad { color: #dc2626; }
  a { color: #2563eb; }
</style></head>
<body>
  <h1>Notato</h1>
  <p class="site" id="site"></p>
  <div id="app"></div>
  <script src="popup.js"></script>
</body></html>
