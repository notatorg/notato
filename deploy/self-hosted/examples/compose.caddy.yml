# HTTPS with Caddy, which gets and renews a Let's Encrypt certificate for you.
#
#   docker compose -f compose.yml -f examples/compose.caddy.yml --env-file .env up -d
#
# In .env set NOTATO_DOMAIN=notato.example.com, NOTATO_PUBLIC_URL=https://notato.example.com, and point the domain's
# DNS at this machine with ports 80 and 443 open. See docs/reverse-proxy.md. Needs Docker Compose 2.24 or later.
services:
  server:
    # Only Caddy reaches Notato now, over the Compose network.
    ports: !reset []
    environment:
      NOTATO_TRUST_PROXY: "1"
  caddy:
    image: caddy:2@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    restart: unless-stopped
    depends_on: [server]
    ports:
      - "${NOTATO_PROXY_HTTP_PORT:-80}:80"
      - "${NOTATO_PROXY_HTTPS_PORT:-443}:443"
      - "${NOTATO_PROXY_HTTPS_PORT:-443}:443/udp"
    environment:
      NOTATO_DOMAIN: ${NOTATO_DOMAIN:?Set NOTATO_DOMAIN to the address people will use, such as notato.example.com}
    volumes:
      - ./examples/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
volumes:
  caddy-data:
  caddy-config:
