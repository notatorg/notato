# Trust a private certificate authority for your database's TLS certificate.
#
#   docker compose -f compose.yml -f examples/compose.ca-file.yml --env-file .env up -d
#
# Put the CA certificate at ./certs/postgres-ca.pem and set NOTATO_DATABASE_SSL=verify-full and
# NOTATO_DATABASE_CA_FILE=/certs/postgres-ca.pem in .env.
services:
  server:
    volumes:
      - ./certs:/certs:ro
