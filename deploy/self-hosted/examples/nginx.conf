# nginx in front of Notato, for a host that already runs nginx. Replace the domain and certificate paths
# (certbot writes them under /etc/letsencrypt/live/<domain>/), and proxy_pass at wherever Notato listens:
# 127.0.0.1:4799 when it is published on the host as in compose.yml. In .env set
# NOTATO_PUBLIC_URL=https://notato.example.com and NOTATO_TRUST_PROXY=1.
server {
    listen 80;
    server_name notato.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name notato.example.com;

    ssl_certificate     /etc/letsencrypt/live/notato.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notato.example.com/privkey.pem;

    # A screenshot upload is at most 32 MiB; leave room for the rest of the form.
    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:4799;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streamed responses (MCP over HTTP) must not be held back.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
