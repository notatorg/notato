org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# What both libraries are published as. `bun scripts/version.ts` (at the repository root) stamps VERSION_NAME, the
# same version as every other Notato package; each library's own gradle.properties names its artifact.
GROUP=dev.notato
VERSION_NAME=0.1.1
POM_URL=https://github.com/notatorg/notato
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://github.com/notatorg/notato/blob/main/LICENSE
POM_DEVELOPER_ID=notatorg
POM_DEVELOPER_NAME=Notato contributors
POM_DEVELOPER_URL=https://github.com/notatorg
POM_SCM_URL=https://github.com/notatorg/notato
POM_SCM_CONNECTION=scm:git:https://github.com/notatorg/notato.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/notatorg/notato.git
