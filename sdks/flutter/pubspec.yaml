name: notato
description: "Notato for Flutter: people pin notes to the widgets of your running app, with a screenshot and the file and line, for your coding agent."
version: 0.2.0
homepage: https://github.com/notatorg/notato
repository: https://github.com/notatorg/notato/tree/main/sdks/flutter
issue_tracker: https://github.com/notatorg/notato/issues
topics:
  - feedback
  - annotations
  - mcp
  - debugging
  - devtools

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  archive: ^4.3.0
  flutter:
    sdk: flutter
  http: ^1.3.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
